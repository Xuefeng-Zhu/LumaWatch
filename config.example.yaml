sources:
  - name: luma-ai
    url: https://luma.com/ai
    type: category_page
  - name: luma-tech
    url: https://luma.com/tech
    type: category_page
  - name: luma-seattle
    url: https://luma.com/seattle
    type: city_page
    enabled: false

location:
  target_city: Seattle
  nearby_terms:
    - Seattle
    - Bellevue
    - Redmond
    - Kirkland
    - Bothell
    - Renton
    - South Lake Union
    - Capitol Hill
    - Pioneer Square
    - University District
    - WA
    - Washington
  timezone: America/Los_Angeles

relevance:
  include_terms:
    - ai
    - artificial intelligence
    - machine learning
    - ml
    - llm
    - genai
    - generative ai
    - agent
    - agents
    - data
    - startup
    - founder
    - software
    - developer
    - engineering
    - tech
    - robotics
  exclude_terms:
    - nightclub
    - yoga
    - dating
    - real estate open house

browser:
  headless: true
  timeout_ms: 60000
  scroll_steps: 6
  scroll_pause_ms: 1200
  user_agent: null
  enrich_details: true
  detail_delay_ms: 1500

polling:
  min_seconds_between_source_checks: 1800
  jitter_seconds: 60

notifications:
  stdout:
    enabled: true
  slack:
    enabled: false
    webhook_url_env: SLACK_WEBHOOK_URL
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID

database:
  path: ./luma_seen.sqlite
